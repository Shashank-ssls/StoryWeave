# Per-work config for the second bundled CC0 sample "The Ninth House" (DESIGN_SPEC
# D8: a larger demo work to exercise cast overload, arcs, and the chapter picker).

title = "The Ninth House"
slug = "the-ninth-house"

[splitting]
# One .txt file per chapter; the heading line inside each file becomes the title.
chapter_mode = "file"
first_chapter_number = 1

[chunking]
max_chars = 600
overlap_sentences = 1

[extraction]
# The genre-agnostic default GLiNER labels cover this cast well (court-intrigue
# fantasy, same ontology as Hollow Crown); no per-work extra_labels needed.

[relations]
# Slightly wider co-occurrence window than Hollow Crown's default: this book's
# scenes run longer (200-350 words vs. Hollow Crown's terser chapters) and its
# named entities are denser per scene, so the default 250-char window under-counts
# real co-occurring pairs. Chosen by inspection against the bible's own relationship
# list (§4), not swept — Part B.3 of docs/INTEGRATION.md records the measured effect.
window_chars = 320

# --- Arcs (D6): 5 named acts, fenced on the name only (F6) --------------------- #
[[arcs]]
name = "The Mourning Bell"
start_chapter = 1
end_chapter = 8

[[arcs]]
name = "The Salt Cipher"
start_chapter = 9
end_chapter = 16

[[arcs]]
name = "The Vell Masque"
start_chapter = 17
end_chapter = 26

[[arcs]]
name = "The Undercroft"
start_chapter = 27
end_chapter = 34

[[arcs]]
name = "The Choosing"
start_chapter = 35
end_chapter = 40

[clustering]
# Abbreviation-merge window (retrofit R3). The default 6 chapters was measured on this
# work and refused 16 correct shortenings - 'juno'->'juno stray', 'fennick'->'lord
# fennick oswald', 'ione'->'ione ashcombe', 'robart kell'->'ser robart kell' and so on -
# because this book introduces a character's full name once, early, and then uses the
# bare surname for the rest of the book. Over 40 chapters that gap routinely exceeds 6.
# Widened to the length of the work, which costs nothing: the ordering rule (rule 2), the
# same-type rule, the stop-word rule and the ambiguity guard are all independent of the
# window, and the measured over-merge count stays 0. Alias recall matters doubly here
# because R4's validator has to find BOTH participants' names inside a quote.
# Knob is DATA, per work (evidence/retrofit/R3_RESULT.md records the sweep).
abbreviation_chapter_window = 40
